<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="entering illustration" data-vowel-garden-visual="semantic-illustration">
  <style>
    .float{animation:vgFloat 3.2s ease-in-out infinite}.pulse{animation:vgPulse 2.4s ease-in-out infinite}.move{animation:vgMove 2.2s ease-in-out infinite}
    @keyframes vgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes vgPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}@keyframes vgMove{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@media (prefers-reduced-motion: reduce){.float,.pulse,.move{animation:none}}
  </style>
  <rect width="320" height="240" rx="28" fill="#f7efe1"/>
  <rect x="18" y="18" width="284" height="204" rx="24" fill="#fff" opacity=".88"/>
  <circle cx="274" cy="46" r="24" fill="#fff" opacity=".45"/>
  <circle cx="44" cy="202" r="28" fill="#fff" opacity=".38"/>
  <ellipse cx="160" cy="198" rx="94" ry="13" fill="#24312f" opacity=".13"/><g transform="translate(160 120)">
    <rect x="-52" y="-74" width="104" height="144" rx="8" fill="#f2d18d" stroke="#24312f" stroke-width="7"/>
    <rect x="-30" y="-48" width="60" height="118" rx="6" fill="#fff8e7" stroke="#24312f" stroke-width="5"/>
    <circle cx="14" cy="8" r="5" fill="#24312f"/>
    <path class="pulse" d="M-108 20L-42 20" fill="none" stroke="#3a9468" stroke-width="9" stroke-linecap="round"/>
  <path d="M-42 20L-60 30M-42 20L-60 10" fill="none" stroke="#3a9468" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
