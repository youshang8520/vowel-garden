<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="pencil illustration" data-vowel-garden-visual="semantic-illustration">
  <style>
    .float{animation:vgFloat 3.2s ease-in-out infinite}.pulse{animation:vgPulse 2.4s ease-in-out infinite}.steam{animation:vgSteam 2.2s ease-in-out infinite}.walk{animation:vgWalk 1.8s ease-in-out infinite}.look{animation:vgLook 2.8s ease-in-out infinite}
    @keyframes vgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes vgPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}@keyframes vgSteam{0%,100%{opacity:.38;transform:translateY(0)}50%{opacity:.9;transform:translateY(-8px)}}@keyframes vgWalk{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes vgLook{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@media (prefers-reduced-motion: reduce){.float,.pulse,.steam,.walk,.look{animation:none}}
  </style>
  <rect width="300" height="260" rx="30" fill="#fff7e8"/>
  <rect x="18" y="18" width="264" height="224" rx="26" fill="#fff" opacity=".86"/>
  <circle cx="252" cy="44" r="24" fill="#fff" opacity=".58"/>
  <circle cx="44" cy="218" r="28" fill="#fff" opacity=".42"/>
  <ellipse cx="150" cy="218" rx="92" ry="12" fill="#20302d" opacity="0.12"/><g class="float" transform="translate(150 130) rotate(-28)"><rect x="-18" y="-82" width="36" height="142" rx="8" fill="#e2a844" stroke="#20302d" stroke-width="7"/><path d="M-18-82 0-122 18-82Z" fill="#f4c8a4" stroke="#20302d" stroke-width="7" stroke-linejoin="round"/><path d="M0-122 7-94H-7Z" fill="#20302d"/><rect x="-18" y="58" width="36" height="28" rx="6" fill="#e87562" stroke="#20302d" stroke-width="7"/></g><rect x="84" y="156" width="126" height="42" rx="10" fill="#fff" stroke="#4d84b8" stroke-width="6" opacity=".76"/><path d="M102 178h84" stroke="#5d6f82" stroke-width="6" stroke-linecap="round" opacity=".48"/><circle cx="230" cy="62" r="16" fill="#e2a844" opacity=".16"/>
</svg>
