    <path d="M-88 54h176" stroke="#20302d" stroke-width="7" opacity=".14" stroke-linecap="round"/>
  </g></g><ellipse cx="152" cy="177" rx="96" ry="22" fill="#fff" stroke="#4d84b8" stroke-width="5" opacity=".58"/><circle cx="224" cy="60" r="13" fill="#4d84b8" opacity=".16"/>
