    <g class="float">
      <rect x="-76" y="-22" width="58" height="54" rx="15" fill="#fff" stroke="#20302d" stroke-width="6"/>
      <path d="M-72-22h50v20h-50Z" fill="#e87562"/>
      <rect x="-22" y="-30" width="58" height="58" rx="16" fill="#fff" stroke="#20302d" stroke-width="6"/>
      <path d="M-18-30h50v22h-50Z" fill="#e2a844"/>
      <rect x="34" y="-20" width="58" height="52" rx="15" fill="#fff" stroke="#20302d" stroke-width="6"/>
      <path d="M38-20h50v20h-50Z" fill="#2f8f67"/>
    </g>
    <path d="M-86 92H86" stroke="#20302d" stroke-width="7" opacity=".12" stroke-linecap="round"/>
  </g><circle cx="232" cy="62" r="16" fill="#2f8f67" opacity=".15"/><path d="M72 204h156" stroke="#e2a844" stroke-width="8" opacity=".16" stroke-linecap="round"/>
