    <circle cx="0" cy="-54" r="17" fill="#fff" stroke="#20302d" stroke-width="5"/>
    <path d="M0-64v10l8 6" fill="none" stroke="#20302d" stroke-width="4" stroke-linecap="round"/>
    <rect x="-70" y="-20" width="34" height="26" rx="4" fill="#dff1ff"/><rect x="36" y="-20" width="34" height="26" rx="4" fill="#dff1ff"/>
    <rect x="-18" y="6" width="36" height="52" rx="6" fill="#2f8f67"/>
