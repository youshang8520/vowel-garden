<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="ticket gate illustration" data-vowel-garden-visual="semantic-illustration">
  <style>
    .float{animation:vgFloat 3.2s ease-in-out infinite}.pulse{animation:vgPulse 2.4s ease-in-out infinite}.move{animation:vgMove 2.2s ease-in-out infinite}
    @keyframes vgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes vgPulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}@keyframes vgMove{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@media (prefers-reduced-motion: reduce){.float,.pulse,.move{animation:none}}
  </style>
  <rect width="320" height="240" rx="28" fill="#eaf1fb"/>
  <rect x="18" y="18" width="284" height="204" rx="24" fill="#fff" opacity=".88"/>
  <circle cx="274" cy="46" r="24" fill="#fff" opacity=".45"/>
  <circle cx="44" cy="202" r="28" fill="#fff" opacity=".38"/>
  <ellipse cx="160" cy="198" rx="94" ry="13" fill="#24312f" opacity=".13"/><g transform="translate(160 122)">
    <rect x="-96" y="-54" width="192" height="96" rx="14" fill="#e8f3ff" stroke="#24312f" stroke-width="7"/>
    <rect x="-76" y="-32" width="52" height="74" rx="8" fill="#2f9a90" opacity=".82"/>
    <rect x="24" y="-32" width="52" height="74" rx="8" fill="#2f9a90" opacity=".82"/>
    <path d="M-96 64H96" stroke="#24312f" stroke-width="7" stroke-linecap="round" opacity=".28"/>
    <path class="pulse" d="M-12 2L32 2" fill="none" stroke="#3a9468" stroke-width="9" stroke-linecap="round"/>
  <path d="M32 2L14 12M32 2L14 -8" fill="none" stroke="#3a9468" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
