  <circle cx="44" cy="218" r="28" fill="#fff" opacity=".42"/>
  <ellipse cx="150" cy="218" rx="94" ry="12" fill="#20302d" opacity="0.12"/><g transform="translate(140 124) scale(0.88)">
    <path class="float" d="M-70-50h90l58 58-90 90-58-58Z" fill="#fff" stroke="#20302d" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="-34" cy="-15" r="10" fill="#e2a844" stroke="#20302d" stroke-width="4"/>
    <path d="M34 34V-38M34-38 12-16M34-38 56-16" fill="none" stroke="#e87562" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-36 44h44" stroke="#5d6f82" stroke-width="7" stroke-linecap="round" opacity=".45"/>
  </g><circle cx="226" cy="66" r="18" fill="#e87562" opacity=".14"/><path d="M84 206h132" stroke="#e87562" stroke-width="8" opacity=".16" stroke-linecap="round"/>
</svg>
